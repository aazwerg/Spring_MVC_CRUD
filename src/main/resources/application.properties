spring.application.name=Spring_MVC_CRUD

# MySQL properties
spring.datasource.url=jdbc:mysql://localhost:3306/two_three_one
spring.datasource.username=app
spring.datasource.password=MySQLAppPassword

# Hibernate properties
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# HTTP methods PUT, PATH, DELETE
spring.mvc.hiddenmethod.filter.enabled=true