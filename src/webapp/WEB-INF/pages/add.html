<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Add user</title>
</head>
<body>
<form th:action="@{/update}" th:object="${user}" method="post">
    <table>
        <tr>
            <td><label for="name">Name</label></td>
            <td><input type="text" id="name" th:field="*{name}" required></td>
        </tr>
        <tr>
            <td><label for="lastName">Last name</label></td>
            <td><input type="text" id="lastName" th:field="*{lastName}" required></td>
        </tr>
        <tr>
            <td><label for="age">Age</label></td>
            <td><input type="number" id="age" th:field="*{age}" required></td>
        </tr>
        <tr>
            <td><label for="email">Email</label></td>
            <td><input type="email" id="email" th:field="*{email}" required></td>
        </tr>
        <tr>
            <td><label for="phone">Phone</label></td>
            <td><input type="text" id="phone" th:field="*{phone}" required></td>
        </tr>
        <tr>
            <td><a href=".">Discard and return</a></td>
            <td><button type="submit">Save and return</button></td>
        </tr>
    </table>
</form>
</body>
</html>
