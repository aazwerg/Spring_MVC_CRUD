<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>
<body>
<table border="2">
    <tr>
        <th><h4>#</h4></th>
        <th><h4>Name</h4></th>
        <th><h4>Last name</h4></th>
        <th><h4>Age</h4></th>
        <th><h4>Email</h4></th>
        <th><h4>Phone</h4></th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>
    <tr th:each="user: ${users}">
        <td><p th:text="${userStat.count}"></p></td>
        <td><p th:text="${user.name}"></p></td>
        <td><p th:text="${user.lastName}"></p></td>
        <td><p th:text="${user.age}"></p></td>
        <td><p th:text="${user.email}"></p></td>
        <td><p th:text="${user.phone}"></p></td>
        <td><a th:href="@{/edit(id=${user.id})}">Edit</a></td>
        <td><a th:href="@{/delete(id=${user.id})}">Delete</a></td>
    </tr>
</table>
<a href="add">Add</a>
</body>
</html>
